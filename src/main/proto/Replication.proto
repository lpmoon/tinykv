syntax = "proto3";

package tinykv;

option java_multiple_files = true;
option java_package = "io.tinykv.proto.replication";
option java_outer_classname = "ReplicationProto";

// Async replication message types (no term — independent from Raft)

// Heartbeat / vote request from leader or candidate
message ReplHeartbeatRequest {
    int32 from_id = 1;
    int32 to_id = 2;
    int64 epoch = 3;
}

// Response to heartbeat / vote request
message ReplHeartbeatResponse {
    int32 from_id = 1;
    int32 to_id = 2;
    int64 epoch = 3;
    bool vote_granted = 4;
}

// Replicate log entries to a follower
message ReplicateEntriesRequest {
    int32 from_id = 1;
    int32 to_id = 2;
    int64 prev_index = 3;
    repeated ReplicationLogEntry entries = 4;
}

// Response from follower confirming replication progress
message ReplicateEntriesResponse {
    int32 from_id = 1;
    int32 to_id = 2;
    bool success = 3;
    int64 match_index = 4;
}

// Single log entry in the replication log
message ReplicationLogEntry {
    int64 index = 1;
    bytes data = 2;
}

// gRPC service for async replication
service ReplicationRpcService {
    rpc HandleHeartbeat(ReplHeartbeatRequest) returns (ReplHeartbeatResponse);
    rpc HandleReplicateEntries(ReplicateEntriesRequest) returns (ReplicateEntriesResponse);
}
