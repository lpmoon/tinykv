syntax = "proto3";

package tinykv;

option java_multiple_files = true;
option java_package = "io.tinykv.proto.raft";
option java_outer_classname = "RaftProto";

// Raft message types
message RequestVoteRequest {
    int32 from_id = 1;
    int32 to_id = 2;
    int64 term = 3;
    int64 last_log_index = 4;
    int64 last_log_term = 5;
}

message RequestVoteResponse {
    int32 from_id = 1;
    int32 to_id = 2;
    int64 term = 3;
    bool vote_granted = 4;
}

message AppendEntriesRequest {
    int32 from_id = 1;
    int32 to_id = 2;
    int64 term = 3;
    int64 prev_log_index = 4;
    int64 prev_log_term = 5;
    repeated LogEntry entries = 6;
    int64 leader_commit = 7;
}

message AppendEntriesResponse {
    int32 from_id = 1;
    int32 to_id = 2;
    int64 term = 3;
    bool success = 4;
    int64 match_index = 5;
}

message LogEntry {
    int64 term = 1;
    int64 index = 2;
    bytes data = 3;
}

message RaftMessage {
    oneof msg {
        RequestVoteRequest request_vote = 1;
        RequestVoteResponse request_vote_response = 2;
        AppendEntriesRequest append_entries = 3;
        AppendEntriesResponse append_entries_response = 4;
    }
}

// gRPC service definition
service RaftRpcService {
    rpc HandleRequestVote(RequestVoteRequest) returns (RequestVoteResponse);
    rpc HandleAppendEntries(AppendEntriesRequest) returns (AppendEntriesResponse);
}
