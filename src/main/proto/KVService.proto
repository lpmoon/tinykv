syntax = "proto3";

package tinykv;

option java_multiple_files = true;
option java_package = "io.tinykv.proto.kv";
option java_outer_classname = "KVProto";

// Client-facing KV service.
// Every node serves this RPC. Non-leader nodes return NOT_LEADER
// with the current leader's address so the client can redirect.
service KVService {
  rpc Get(GetRequest) returns (GetResponse);
  rpc Put(PutRequest) returns (PutResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);
  rpc Scan(ScanRequest) returns (stream ScanEntry);
  // Returns cluster metadata: who the leader is, all node addresses.
  rpc GetClusterInfo(ClusterInfoRequest) returns (ClusterInfoResponse);
}

// ── Requests ──────────────────────────────────────────────

message GetRequest {
  bytes key = 1;
}

message PutRequest {
  bytes key = 1;
  bytes value = 2;
}

message DeleteRequest {
  bytes key = 1;
}

message ScanRequest {
  bytes start_key = 1;
  bytes end_key = 2;
  int32 limit = 3;  // 0 = unlimited
}

message ClusterInfoRequest {}

// ── Responses ─────────────────────────────────────────────

message GetResponse {
  bool found = 1;
  bytes value = 2;
  // Leader hint: filled when this node is not the leader.
  string leader_address = 10;
  int32 leader_id = 11;
}

message PutResponse {
  bool ok = 1;
  string leader_address = 10;
  int32 leader_id = 11;
}

message DeleteResponse {
  bool ok = 1;
  string leader_address = 10;
  int32 leader_id = 11;
}

// Each ScanEntry is one key-value pair streamed back to the client.
message ScanEntry {
  bytes key = 1;
  bytes value = 2;
}

message ClusterInfoResponse {
  int32 leader_id = 1;
  string leader_address = 2;
  // All known peers: nodeId -> "host:port"
  map<int32, string> peer_addresses = 3;
}
